[project]
name = "agent-playground"
version = "0.1.0"
description = "Multi-agent experiments with frontier and open-source models"
requires-python = ">=3.11"
dependencies = [
    # Agent frameworks
    "langgraph>=0.2",
    "pydantic-ai>=0.0.14",
    # Observability
    "logfire[pydantic-ai]>=3.0",
    # Model providers
    "anthropic>=0.40",
    "openai>=1.50",
    # GUI
    "pygame>=2.6",
    # Image support (screenshots → agents)
    "pillow>=11.0",
    # Notebooks
    "ipykernel>=6.29",
    # Settings / env var management
    "pydantic-settings>=2.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.18",
    "ruff>=0.8",
]
tts-system = ["pyttsx3>=2.90"]
local = ["ollama>=0.4"]

[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingImports = true
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
